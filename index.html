<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roblox Developer Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efece4;--fg:#141414;--mute:#6b675e;--line:#c9c4b8;--acc:#e5391a;--accfg:#fff;
  --head:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b0b0c;--fg:#ece8df;--mute:#8a867d;--line:#26262a;--acc:#ff4d1f;--accfg:#0b0b0c}
}
:root[data-theme="dark"]{--bg:#0b0b0c;--fg:#ece8df;--mute:#8a867d;--line:#26262a;--acc:#ff4d1f;--accfg:#0b0b0c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);gap:16px}
.logo{font-family:var(--head);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.logo i{font-style:normal;color:var(--acc)}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a{padding:4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);border:1px solid transparent;transition:.15s}
.nav a:hover{color:var(--fg);border-color:var(--line)}
.nav a.on{color:var(--accfg);background:var(--acc)}
@media(max-width:820px){.nav a:not(.on):not(.home){display:none}}

/* home */
.hero{padding:clamp(48px,10vw,120px) 0 clamp(36px,6vw,72px)}
.kicker{color:var(--acc);text-transform:uppercase;letter-spacing:.16em;font-size:12px;margin-bottom:18px}
.hero h1{font-family:var(--head);font-weight:900;text-transform:uppercase;line-height:.86;margin:0;font-size:clamp(64px,15vw,210px);letter-spacing:-.01em}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:2px var(--fg)}
.hero p{max-width:520px;color:var(--mute);margin:28px 0 0}
.idx{border-top:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:70px 1fr auto 40px;align-items:center;gap:12px;padding:26px 8px;border-bottom:1px solid var(--line);overflow:hidden;isolation:isolate}
.row::before{content:"";position:absolute;inset:0;background:var(--acc);transform:translateX(-101%);transition:transform .35s cubic-bezier(.7,0,.2,1);z-index:-1}
.row:hover::before{transform:none}
.row:hover{color:var(--accfg)}
.row .n{color:var(--mute);transition:.2s}
.row:hover .n,.row:hover .c,.row:hover .d{color:var(--accfg)}
.row .t{font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:clamp(34px,6.2vw,76px);line-height:1;transition:transform .35s}
.row:hover .t{transform:translateX(14px)}
.row .d{color:var(--mute);font-size:12px;max-width:260px;text-align:right}
.row .c{color:var(--mute);font-size:12px;text-align:right;white-space:nowrap}
.row .ar{font-size:24px;text-align:right;transition:transform .3s}
.row:hover .ar{transform:translateX(6px)}
@media(max-width:760px){.row{grid-template-columns:40px 1fr 30px}.row .d,.row .c{display:none}}

/* category */
.top{padding:clamp(36px,7vw,84px) 0 28px}
.back{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.back:hover{color:var(--acc)}
.top h1{font-family:var(--head);font-weight:900;text-transform:uppercase;line-height:.88;margin:18px 0 0;font-size:clamp(56px,12vw,170px)}
.top h1 em{font-style:normal;color:var(--acc);font-size:.38em;vertical-align:top;margin-right:.3em;font-family:var(--mono);font-weight:500}
.top p{max-width:560px;color:var(--mute);margin:22px 0 0}
.skills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.skills b{font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border:1px solid var(--line);color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(28px,4vw,56px) clamp(18px,3vw,40px);padding:24px 0 60px}
.grid.one{grid-template-columns:minmax(0,820px)}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card .frame{position:relative;aspect-ratio:16/9;background:#000;outline:1px solid var(--line);outline-offset:6px}
.card iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.1em;background:repeating-linear-gradient(135deg,transparent 0 12px,var(--line) 12px 13px)}
.cap{display:flex;gap:14px;margin-top:22px;align-items:baseline}
.cap .k{color:var(--acc);font-size:12px}
.cap h3{margin:0;font-family:var(--head);font-weight:700;font-size:clamp(22px,2.4vw,30px);text-transform:uppercase;line-height:1.05}
.cap p{margin:4px 0 0;color:var(--mute);font-size:12px}

/* next */
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding:34px 8px;transition:.2s}
.next:hover{background:var(--acc);color:var(--accfg)}
.next small{display:block;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.next:hover small{color:var(--accfg)}
.next span{font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:clamp(34px,6vw,72px);line-height:1}

footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--fg);border-bottom:1px solid var(--acc)}
.empty{color:var(--mute);padding:20px 0 60px}
.view{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.empty{color:var(--mute);padding:20px 0 60px}
.view{animation:none}.row::before,.row .t{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="logo" href="#/"><span id="logo-name">Portfolio</span><i>.</i></a>
    <nav class="nav" id="nav"></nav>
  </header>
  <main id="app"></main>
  <footer>
    <span id="foot-l"></span>
    <span id="foot-r"></span>
  </footer>
</div>

<script src="videos.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $("#app"), nav = $("#nav");
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const safeHref = h => /^(https?:|mailto:)/i.test(h||"") ? h : "#";

let SITE = {}, CATS = [];

function ytId(u){
  const m = String(u||"").match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);
  return m ? m[1] : "";
}

/* Reads videos.js and builds every category from it, so new ones appear automatically. */
function normalize(data){
  SITE = data.site || {};
  const used = new Set();
  CATS = (data.categories || []).filter(c => c && c.title).map(c => {
    let id = slug(c.id || c.title) || "category", base = id, n = 2;
    while(used.has(id)) id = base + "-" + n++;
    used.add(id);
    return {
      id, title: c.title, desc: c.description || "",
      skills: Array.isArray(c.skills) ? c.skills : [],
      videos: (c.videos || []).map(v => typeof v === "string" ? {title:"Untitled", url:v} : v).filter(Boolean)
    };
  });
}

function buildChrome(){
  document.title = `${SITE.name || "Portfolio"} - Roblox Developer`;
  $("#logo-name").textContent = SITE.name || "Portfolio";
  nav.innerHTML = `<a class="home" href="#/">Index</a>` +
    CATS.map(c => `<a href="#/${c.id}" data-id="${c.id}">${esc(c.title)}</a>`).join("");
  $("#foot-l").textContent = `© ${new Date().getFullYear()} ${SITE.name || ""}`;
  $("#foot-r").innerHTML = (SITE.contact || []).map(c =>
    `<a href="${esc(safeHref(c.href))}" target="_blank" rel="noopener">${esc(c.label)}</a>`).join(" &nbsp; ");
}

function home(){
  const total = CATS.reduce((a,c) => a + c.videos.length, 0);
  return `<section class="view">
    <div class="hero">
      <div class="kicker">Portfolio / ${total} clip${total===1?"":"s"} / ${CATS.length} categor${CATS.length===1?"y":"ies"}</div>
      <h1>Roblox<span>Developer</span></h1>
      <p>${esc(SITE.tagline || "")}</p>
    </div>
    <div class="idx">` +
    CATS.map((c,i) => `<a class="row" href="#/${c.id}">
      <span class="n">${pad(i+1)}</span><span class="t">${esc(c.title)}</span>
      <span class="d">${esc(c.desc)}</span><span class="c">${c.videos.length} clip${c.videos.length===1?"":"s"}</span><span class="ar">→</span></a>`).join("") +
    `</div></section>`;
}

function cat(id){
  const i = CATS.findIndex(c => c.id === id);
  if(i < 0) return home();
  const c = CATS[i], nx = CATS[(i+1) % CATS.length];
  const cards = c.videos.map((v,j) => {
    const vid = ytId(v.url);
    const media = vid
      ? `<iframe src="https://www.youtube.com/embed/${vid}?rel=0&modestbranding=1" title="${esc(v.title)}" loading="lazy" frameborder="0" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`
      : `<div class="ph">Add a YouTube link in videos.js</div>`;
    return `<article class="card"><div class="frame">${media}</div>
      <div class="cap"><span class="k">${pad(j+1)}</span><div><h3>${esc(v.title || "Untitled")}</h3>${v.note ? `<p>${esc(v.note)}</p>` : ""}</div></div></article>`;
  }).join("");
  return `<section class="view">
    <div class="top">
      <a class="back" href="#/">← Index</a>
      <h1><em>${pad(i+1)}</em>${esc(c.title)}</h1>
      ${c.desc ? `<p>${esc(c.desc)}</p>` : ""}
      ${c.skills.length ? `<div class="skills">${c.skills.map(s => `<b>${esc(s)}</b>`).join("")}</div>` : ""}
    </div>
    ${c.videos.length ? `<div class="grid ${c.videos.length===1?"one":""}">${cards}</div>` : `<p class="empty">No videos in this category yet.</p>`}
    ${CATS.length > 1 ? `<a class="next" href="#/${nx.id}"><div><small>Next</small><span>${esc(nx.title)}</span></div><span>→</span></a>` : ""}
  </section>`;
}

function route(){
  const id = (location.hash.replace(/^#\/?/,"") || "").trim();
  app.innerHTML = id ? cat(id) : home();
  nav.querySelectorAll("a[data-id]").forEach(a => a.classList.toggle("on", a.dataset.id === id));
  window.scrollTo(0,0);
}

function fail(msg){
  app.innerHTML = `<section class="view top"><h1>Can't load<br>videos.js</h1><p>${esc(msg)}</p><p>Make sure <b>videos.js</b> sits next to index.html, and check it for a missing comma, quote or bracket.</p></section>`;
}

if(window.PORTFOLIO){ normalize(window.PORTFOLIO); buildChrome(); addEventListener("hashchange", route); route(); }
else fail("videos.js is missing or has a syntax error.");
</script>
</body>
</html>
